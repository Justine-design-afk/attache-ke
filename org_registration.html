<!DOCTYPE html>

<body class="d-flex flex-column min-vh-100">

    <div class="only mb-4">
        <h3 class="h5 text-center text-danger">This form is meant to be filled strictly by approved organisations</h3>
    </div>

    <div class="container mb-3">
        <div class="row">
            <!-- image placement -->
            <div class="col-md-5">
                <img class="img-fluid picha" src="./images/scott-blake-x-ghf9LjrVg-unsplash.jpg" alt="">
            </div>
            <!-- form -->
            <div class="col-md-7">
                <form>
                    <div class="mb-3 mt-3">
                        <label for="comp" class="form-label">Company:</label>
                        <input type="company" class="form-control" id="com" placeholder="Enter company name"
                            name="compo" required>
                    </div>
                    <div class="mb-3">
                        <label for="loc" class="form-label">Location:</label>
                        <input type="Location" class="form-control" id="loc" placeholder="Enter location" name="locate" required>
                    </div>
                    <div class="mb-3">
                        <label for="job" class="form-label">Job_type:</label>
                        <input type="Job_type" class="form-control" id="jbt" placeholder="enter the job type"
                            name="job_t" required>
                    </div>
                    <div class="mb-3">
                        <label for="slo" class="form-label">Slots:</label>
                        <input type="slots" class="form-control" id="slt"
                            placeholder="enter the amount of slots available" name="slot" required>
                    </div>
                    <button type="submit" class="btn btn-success">Submit</button>
                </form>
            </div>
        </div>
    </div>

    <!-- footer -->
    <footer class="footer border-top mt-auto">

                    </ul>
                </div>
                <div class="col-md-4">
                    <h2 class="h4">Contacts</h2>
                    <ul class="list-unstyled">
                        <li><i class="bi bi-envelope-at-fill me-2"></i>just81411@gmail.com</li>
                        <li><i class="bi bi-phone-vibrate-fill me-2"></i>0713096653</li>
                    </ul>
